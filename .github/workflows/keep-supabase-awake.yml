# Free Supabase projects pause after about a week with no activity.
# This reads one leaderboard row every 3 days so the project stays awake. It changes nothing.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one leaderboard row
        run: |
          curl -fsS "https://vcvmmedfoxkmbubjqjcp.supabase.co/rest/v1/scores?select=id&limit=1" \
            -H "apikey: sb_publishable__U6DbnFvUBjRrlWaU0S5Xg_cHb5sPrb" \
            -o /dev/null -w "Supabase answered with HTTP %{http_code}\n"
